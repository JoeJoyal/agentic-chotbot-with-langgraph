name: Streamlit AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

# Avoid overlapping production deployments.
concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  STREAMLIT_PORT: "8501"
  CONTAINER_NAME: stapp

jobs:
  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep this aligned with the Python version in your Dockerfile.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Lint Python files
        run: |
          # Ruff may flag existing style issues. Fix them or configure
          # project rules in pyproject.toml rather than skipping CI.
          ruff check .

      - name: Run unit tests
        run: |
          if find . -type f -name 'test_*.py' \
              -not -path './.git/*' \
              -not -path './.venv/*' \
              -print -quit | grep -q .; then
            python -m pip install -r requirements.txt
            python -m pytest -q
          else
            echo "No test_*.py files found; add unit tests to enable this check."
          fi

  # ============================================================
  # 2. BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          test -n "$DOCKER_USERNAME" || {
            echo "::error::DOCKER_USERNAME secret is missing."
            exit 1
          }
          test -n "$DOCKER_PASSWORD" || {
            echo "::error::DOCKER_PASSWORD secret is missing."
            exit 1
          }
          test -n "$IMAGE_NAME" || {
            echo "::error::IMAGE_NAME secret is missing."
            exit 1
          }

          echo "Docker Hub secrets are present."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. DEPLOY TO AWS EC2 SELF-HOSTED RUNNER
  # ============================================================
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted
    # Optional: configure a GitHub Environment named "production"
    # and move deployment secrets to that environment if desired.

    steps:
      - name: Validate deployment secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -eu

          for name in DOCKER_USERNAME DOCKER_PASSWORD IMAGE_NAME \
                      GOOGLE_API_KEY TAVILY_API_KEY OPENWEATHER_API_KEY; do
            eval 'value=${'${name}':-}'
            if [ -z "$value" ]; then
              echo "::error::$name secret is missing."
              exit 1
            fi
          done

          echo "Required deployment secrets are present."

      - name: Log in to Docker Hub on EC2 runner
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image for this commit
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -eu
          docker pull "${IMAGE_PATH}:${IMAGE_TAG}"

      - name: Deploy container and roll back on failure
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          NEW_IMAGE="${IMAGE_PATH}:${IMAGE_TAG}"
          OLD_IMAGE=""

          # Save the old container image reference for a basic rollback.
          if docker container inspect stapp >/dev/null 2>&1; then
            OLD_IMAGE="$(docker inspect --format='{{.Config.Image}}' stapp)"
          fi

          # Preserve an existing container's mounts and environment only
          # if they are explicitly configured in your deployment process.
          # Add your real persistent volume mounts to docker run below.
          docker rm -f stapp 2>/dev/null || true

          start_container() {
            local image="$1"
            docker run -d \
              --restart unless-stopped \
              --name stapp \
              -p 8501:8501 \
              -e OPENAI_API_KEY \
              -e GOOGLE_API_KEY \
              -e TAVILY_API_KEY \
              -e OPENWEATHER_API_KEY \
              -e LANGSMITH_TRACING \
              -e LANGSMITH_ENDPOINT \
              -e LANGSMITH_API_KEY \
              -e LANGSMITH_PROJECT \
              "$image"
          }

          rollback() {
            echo "::error::New deployment failed. Attempting rollback."
            docker rm -f stapp 2>/dev/null || true

            if [ -n "$OLD_IMAGE" ]; then
              if docker image inspect "$OLD_IMAGE" >/dev/null 2>&1; then
                start_container "$OLD_IMAGE" || true
                echo "Rollback attempted using: $OLD_IMAGE"
              else
                echo "Previous image is not present locally; rollback unavailable."
              fi
            else
              echo "No previous container image was found to roll back to."
            fi
          }

          start_container "$NEW_IMAGE"

          # Wait for Streamlit to report healthy before accepting deployment.
          for attempt in $(seq 1 24); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)" \
              >/dev/null 2>&1; then
              echo "Streamlit health check passed."
              exit 0
            fi

            if ! docker ps \
              --filter "name=^stapp$" \
              --filter "status=running" \
              --format '{{.Names}}' | grep -qx stapp; then
              echo "Container stopped before becoming healthy."
              break
            fi

            echo "Waiting for Streamlit health check ($attempt/24)..."
            sleep 5
          done

          docker logs --tail 100 stapp 2>/dev/null || true
          rollback
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 stapp 2>/dev/null || true

      - name: Remove dangling Docker images
        if: always()
        run: |
          docker image prune -f
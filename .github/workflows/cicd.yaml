name: Streamlit AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  # Allows you to run the workflow manually
  workflow_dispatch:

# Prevent two deployments from running at the same time
concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint code
        run: |
          echo "Linting repository"

      - name: Run unit tests
        run: |
          echo "Running unit tests"

  # ============================================================
  # 2. BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        shell: bash
        run: |
          set -eu

          for name in DOCKER_USERNAME DOCKER_PASSWORD IMAGE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name secret is missing."
              exit 1
            fi
          done

          echo "Required Docker Hub secrets are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. DEPLOY TO AWS EC2
  # ============================================================
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:
      - name: Validate deployment secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        shell: bash
        run: |
          set -eu

          for name in \
            DOCKER_USERNAME \
            DOCKER_PASSWORD \
            IMAGE_NAME \
            TAVILY_API_KEY \
            OPENWEATHER_API_KEY \
            ALPHA_VANTAGE_API_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name secret is missing."
              exit 1
            fi
          done

          echo "Required deployment secrets are configured."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image for this commit
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -eu
          docker pull "${IMAGE_PATH}:${IMAGE_TAG}"

      - name: Deploy and verify application
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}

          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}

        shell: bash
        run: |
          set -Eeuo pipefail

          NEW_IMAGE="${IMAGE_PATH}:${IMAGE_TAG}"
          OLD_IMAGE=""

          if docker container inspect stapp >/dev/null 2>&1; then
            OLD_IMAGE="$(docker inspect \
              --format='{{.Config.Image}}' stapp)"
          fi

          start_container() {
            local image="$1"

            docker run -d \
              --restart unless-stopped \
              --name stapp \
              -p 8501:8501 \
              -e GOOGLE_API_KEY \
              -e TAVILY_API_KEY \
              -e OPENWEATHER_API_KEY \
              -e ALPHA_VANTAGE_API_KEY \
              -e LANGSMITH_TRACING \
              -e LANGSMITH_ENDPOINT \
              -e LANGSMITH_API_KEY \
              -e LANGSMITH_PROJECT \
              "$image"
          }

          rollback() {
            echo "Attempting rollback."
            docker rm -f stapp 2>/dev/null || true

            if [[ -n "$OLD_IMAGE" ]] && \
               docker image inspect "$OLD_IMAGE" >/dev/null 2>&1; then
              if start_container "$OLD_IMAGE"; then
                echo "Previous image restarted: $OLD_IMAGE"
              else
                echo "::error::Rollback container could not start."
              fi
            else
              echo "::warning::No previous local image is available."
            fi
          }

          # Remove the old container before reusing the stapp name.
          # IMPORTANT: persistent data must be stored outside this
          # container or mounted from a persistent Docker volume.
          docker rm -f stapp 2>/dev/null || true

          if ! start_container "$NEW_IMAGE"; then
            echo "::error::New container failed to start."
            rollback
            exit 1
          fi

          for attempt in $(seq 1 24); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)" \
              >/dev/null 2>&1; then
              echo "Streamlit health check passed."
              exit 0
            fi

            if ! docker ps \
              --filter "name=^stapp$" \
              --filter "status=running" \
              --format '{{.Names}}' | grep -qx stapp; then
              echo "Container stopped before becoming healthy."
              break
            fi

            echo "Waiting for Streamlit ($attempt/24)..."
            sleep 5
          done

          docker logs --tail 100 stapp 2>/dev/null || true
          rollback
          exit 1

      - name: Show recent application logs
        if: always()
        shell: bash
        run: |
          docker logs --tail 50 stapp 2>/dev/null || true

      - name: Remove dangling Docker images
        if: always()
        run: docker image prune -f
